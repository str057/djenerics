{% extends 'base.html' %}
{% load widget_tweaks %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title mb-0">
                        {% if object %}Редактирование рассылки{% else %}Создание рассылки{% endif %}
                    </h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        <!-- Время начала с календарем -->
                        <div class="mb-3">
                            <label for="{{ form.start_time.id_for_label }}" class="form-label">Время начала:</label>
                            <input type="datetime-local"
                                   name="{{ form.start_time.name }}"
                                   id="{{ form.start_time.id_for_label }}"
                                   class="form-control"
                                   value="{{ form.start_time.value|date:'Y-m-d\TH:i' }}"
                                   required>
                        </div>

                        <!-- Время окончания с календарем -->
                        <div class="mb-3">
                            <label for="{{ form.end_time.id_for_label }}" class="form-label">Время окончания:</label>
                            <input type="datetime-local"
                                   name="{{ form.end_time.name }}"
                                   id="{{ form.end_time.id_for_label }}"
                                   class="form-control"
                                   value="{{ form.end_time.value|date:'Y-m-d\TH:i' }}"
                                   required>
                        </div>

                        <!-- Остальные поля -->
                        <div class="mb-3">
                            <label for="{{ form.message.id_for_label }}" class="form-label">Сообщение:</label>
                            {{ form.message }}
                        </div>

                        <div class="mb-3">
                            <label for="{{ form.clients.id_for_label }}" class="form-label">Клиенты:</label>
                            {{ form.clients }}
                        </div>

                        <div class="mb-3">
                            <label for="{{ form.status.id_for_label }}" class="form-label">Статус:</label>
                            {{ form.status }}
                        </div>

                        <div class="mb-3">
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                            <a href="/mailings/" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Подключение flatpickr для красивого календаря -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Календарь для времени начала
    flatpickr("#id_start_time", {
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        time_24hr: true,
        locale: "ru",
        minuteIncrement: 1
    });

    // Календарь для времени окончания
    flatpickr("#id_end_time", {
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        time_24hr: true,
        locale: "ru",
        minuteIncrement: 1
    });
});
</script>

<style>
.flatpickr-calendar {
    font-family: inherit;
}
.form-control:focus {
    border-color: #86b7fe;
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
}
</style>
{% endblock %}
