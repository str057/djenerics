{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Удаление рассылки</h2>

    <p>Вы уверены, что хотите удалить рассылку "{{ object.subject }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'mailings:mailing_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
