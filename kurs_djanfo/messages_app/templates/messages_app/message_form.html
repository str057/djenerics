{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>{% if form.instance.pk %}Редактировать{% else %}Создать{% endif %} сообщение</h2>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="{{ form.subject.id_for_label }}" class="form-label">Тема</label>
            <input type="text" name="subject" class="form-control" id="id_subject"
                   value="{{ form.subject.value|default:'' }}" required>
            {% if form.subject.errors %}
                <div class="text-danger">{{ form.subject.errors }}</div>
            {% endif %}
        </div>

        <div class="mb-3">
            <label for="{{ form.body.id_for_label }}" class="form-label">Текст сообщения</label>
            <textarea name="body" class="form-control" id="id_body" rows="5" required>{{ form.body.value|default:'' }}</textarea>
            {% if form.body.errors %}
                <div class="text-danger">{{ form.body.errors }}</div>
            {% endif %}
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'messages_app:list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
