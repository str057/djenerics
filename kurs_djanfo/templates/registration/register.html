{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Регистрация</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" id="id_email" required>
                    </div>

                    <div class="mb-3">
                        <label for="id_first_name" class="form-label">Имя</label>
                        <input type="text" name="first_name" class="form-control" id="id_first_name">
                    </div>

                    <div class="mb-3">
                        <label for="id_last_name" class="form-label">Фамилия</label>
                        <input type="text" name="last_name" class="form-control" id="id_last_name">
                    </div>

                    <div class="mb-3">
                        <label for="id_phone" class="form-label">Телефон</label>
                        <input type="text" name="phone" class="form-control" id="id_phone">
                    </div>

                    <div class="mb-3">
                        <label for="id_country" class="form-label">Страна</label>
                        <input type="text" name="country" class="form-control" id="id_country">
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">Пароль</label>
                        <input type="password" name="password" class="form-control" id="id_password" required>
                    </div>

                    <div class="mb-3">
                        <label for="id_password_confirm" class="form-label">Подтверждение пароля</label>
                        <input type="password" name="password_confirm" class="form-control" id="id_password_confirm" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
                </form>

                <div class="mt-3 text-center">
                    <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
