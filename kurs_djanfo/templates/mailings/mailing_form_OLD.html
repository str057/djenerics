{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>{% if object %}Редактирование{% else %}Создание{% endif %} рассылки</h2>

    <form method="post" class="mt-3">
        {% csrf_token %}

        <div class="mb-3">
            <label for="id_start_time" class="form-label">Время начала:</label>
            <input type="datetime-local" name="start_time" class="form-control" id="id_start_time"
                   value="{{ form.start_time.value|date:'Y-m-d\TH:i' }}" required>
        </div>

        <div class="mb-3">
            <label for="id_end_time" class="form-label">Время окончания:</label>
            <input type="datetime-local" name="end_time" class="form-control" id="id_end_time"
                   value="{{ form.end_time.value|date:'Y-m-d\TH:i' }}" required>
        </div>

        <div class="mb-3">
            <label for="id_message" class="form-label">Сообщение:</label>
            <select name="message" class="form-select" id="id_message" required>
                <option value="">Выберите сообщение</option>
                {% for message in form.message.field.queryset %}
                    <option value="{{ message.id }}" {% if form.message.value == message.id %}selected{% endif %}>
                        {{ message.subject }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Клиенты:</label>
            <div class="border p-2" style="max-height: 200px; overflow-y: auto;">
                {% for client in form.clients.field.queryset %}
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="clients"
                               value="{{ client.id }}" id="client_{{ client.id }}"
                               {% if client.id in form.clients.value %}checked{% endif %}>
                        <label class="form-check-label" for="client_{{ client.id }}">
                            {{ client.full_name }} ({{ client.email }})
                        </label>
                    </div>
                {% endfor %}
            </div>
        </div>

        <div class="mb-3">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'mailings:list' %}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
